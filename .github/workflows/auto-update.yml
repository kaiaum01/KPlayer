name: KPlayer - Auto-Update (updates/) e Release Automática

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'android/**'
      - 'ports/**'
      - 'src/**'
      - 'server.ts'
      - 'package.json'
      - 'releases/RELEASE_NOTES.md'
    paths-ignore:
      - 'updates/**'

permissions:
  contents: write

jobs:
  build-r36s-update:
    name: Compilar R36S para canal updates/ e Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Compilar Golazo para R36S
        env:
          GOPATH: ${{ runner.temp }}/golazo-gopath
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go install github.com/0xjuanma/golazo@latest
          cp "$GOPATH/bin/linux_arm64/golazo" ports/kplayer/golazo
      - name: Instalar compilador ARM64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu pkg-config patch xz-utils make flex bison file
      - name: Cachear núcleo libVLC ARM64
        uses: actions/cache@v4
        with:
          path: ports/kplayer/lib
          key: libvlc-3.0.23-arm64-${{ hashFiles('patches/kplayer-vlc.patch', 'tools/build_libvlc_arm64.sh') }}
      - name: Compilar núcleo libVLC ARM64
        run: bash tools/build_libvlc_arm64.sh
      - name: Compilar KPlayer ARM64
        run: |
          aarch64-linux-gnu-gcc -O2 -std=gnu11 -Wall -Wextra -Werror \
            -I source/include source/kplayer.c -o ports/kplayer/kplayer \
            -ldl -lpthread -lm
      - name: Gravar repositório do canal de auto-update
        run: echo "${{ github.repository }}" > ports/kplayer/update-repo.txt
      - name: Empacotar R36S
        run: python3 tools/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: KPlayer-Update-R36S
          path: |
            releases/KPlayer-v*-R36S.zip
            releases/KPlayer-v*-R36S.zip.sha256

  build-android-update:
    name: Compilar Android APK para canal updates/ e Release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar APK Release
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Empacotar APK e SHA-256
        run: |
          mkdir -p releases
          VERSION="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' source/version.h | head -n 1)"
          cp android/app/build/outputs/apk/release/app-release.apk "releases/KPlayer-v${VERSION}-Android.apk"
          (cd releases && sha256sum "KPlayer-v${VERSION}-Android.apk" > "KPlayer-v${VERSION}-Android.apk.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: KPlayer-Update-Android
          path: |
            releases/KPlayer-v*-Android.apk
            releases/KPlayer-v*-Android.apk.sha256

  publish-updates-and-release:
    name: Publicar pasta updates/ e GitHub Release automaticamente
    needs: [build-r36s-update, build-android-update]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: KPlayer-Update-R36S
          path: releases
      - uses: actions/download-artifact@v4
        with:
          name: KPlayer-Update-Android
          path: releases
      - name: Publicar manifesto e pacotes na pasta updates/
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          KPLAYER_UPDATE_BRANCH: main
        run: python3 tools/publish_update_manifest.py
      - name: Commitar pasta updates/ automaticamente
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/
          if git diff --cached --quiet; then
            echo "Sem alterações na pasta updates/."
            exit 0
          fi
          VERSION="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' source/version.h | head -n 1)"
          git commit -m "chore(updates): publicar auto-update v${VERSION} [skip ci]"
          git push origin HEAD:main
      - name: Montar notas da Release com modificações desta versão
        run: |
          VERSION="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' source/version.h | head -n 1)"
          TAG="v${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"

          {
            if [ -f releases/RELEASE_NOTES.md ]; then
              cat releases/RELEASE_NOTES.md
            else
              echo "# KPlayer ${TAG}"
            fi
            echo ""
            echo "---"
            echo ""
            echo "## Modificações incluídas neste commit"
            PREV_TAG="$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -n 1 || true)"
            if [ -n "$PREV_TAG" ]; then
              git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- %s (%h)" | grep -v "\[skip ci\]" | head -n 25 || true
            else
              git log -n 10 --no-merges --pretty=format:"- %s (%h)" | grep -v "\[skip ci\]" || true
            fi
            echo ""
            echo ""
            echo "### Canal Auto-Update"
            echo "- Manifesto: \`updates/latest.json\`"
            echo "- Pacotes arquivados: \`updates/${TAG}/\`"
          } > /tmp/kplayer_release_notes.md
      - name: Criar ou atualizar GitHub Release automaticamente
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=(
            "releases/KPlayer-v${VERSION}-R36S.zip"
            "releases/KPlayer-v${VERSION}-R36S.zip.sha256"
            "releases/KPlayer-v${VERSION}-Android.apk"
            "releases/KPlayer-v${VERSION}-Android.apk.sha256"
          )

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "KPlayer ${RELEASE_TAG} — R36S & Android" \
              --notes-file /tmp/kplayer_release_notes.md \
              --latest
            gh release upload "${RELEASE_TAG}" "${ASSETS[@]}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${ASSETS[@]}" \
              --title "KPlayer ${RELEASE_TAG} — R36S & Android" \
              --notes-file /tmp/kplayer_release_notes.md \
              --target main \
              --latest
          fi
