name: Compilar KPlayer PC para Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Testar listas IPTV
        run: python -m unittest discover -s tests -p test_playlists.py -v
      - name: Compilar executável Windows
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name KPlayer-PC kplayer_pc.py
      - uses: actions/upload-artifact@v4
        with:
          name: KPlayer-PC-Windows-x64
          path: dist/KPlayer-PC.exe
          if-no-files-found: error
