name: KPlayer R36S - Compilar e preparar release por tag

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release-r36s:
    name: Compilar e publicar Release R36S
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Compilar Golazo para R36S
        env:
          GOPATH: ${{ runner.temp }}/golazo-gopath
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go install github.com/0xjuanma/golazo@latest
          cp "$GOPATH/bin/linux_arm64/golazo" ports/kplayer/golazo
      - name: Instalar compilador ARM64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu pkg-config patch xz-utils make flex bison file
      - name: Cachear núcleo libVLC ARM64
        uses: actions/cache@v4
        with:
          path: ports/kplayer/lib
          key: libvlc-3.0.23-arm64-${{ hashFiles('patches/kplayer-vlc.patch', 'tools/build_libvlc_arm64.sh') }}
      - name: Compilar núcleo libVLC ARM64
        run: bash tools/build_libvlc_arm64.sh
      - name: Testar scripts Python
        run: |
          python3 -m py_compile ports/kplayer/updater.py ports/kplayer/weather_fetch.py ports/kplayer/iptv_fetch.py ports/kplayer/football_fetch.py
          python3 -m unittest discover -s tests -p test_football.py -v
      - name: Gravar repositório do canal de auto-update
        run: echo "${{ github.repository }}" > ports/kplayer/update-repo.txt
      - name: Compilar KPlayer R36S
        run: |
          aarch64-linux-gnu-gcc -O2 -std=gnu11 -Wall -Wextra -Werror \
            -I source/include source/kplayer.c -o ports/kplayer/kplayer \
            -ldl -lpthread -lm
          file ports/kplayer/kplayer
      - name: Gerar pacote R36S e checksum
        env:
          KPLAYER_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 tools/package_release.py
      - name: Disponibilizar artefato R36S
        uses: actions/upload-artifact@v4
        with:
          name: KPlayer-R36S
          path: |
            releases/KPlayer-v*-R36S.zip
            releases/KPlayer-v*-R36S.zip.sha256
          if-no-files-found: error
      - name: Publicar release R36S na tag
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          make_latest: true
          name: KPlayer ${{ github.ref_name }} — R36S
          body_path: releases/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            releases/KPlayer-v*-R36S.zip
            releases/KPlayer-v*-R36S.zip.sha256
