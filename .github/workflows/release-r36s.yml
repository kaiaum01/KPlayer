name: KPlayer - Compilar e preparar release R36S

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-r36s:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Compilar Golazo para R36S
        env:
          GOPATH: ${{ runner.temp }}/golazo-gopath
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go install github.com/0xjuanma/golazo@latest
          cp "$GOPATH/bin/linux_arm64/golazo" ports/kplayer/golazo
      - name: Instalar compilador ARM64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu file
      - name: Testar verificação e instalação simulada
        run: python3 -m unittest discover -s tests -p test_updater.py -v
      - name: Testar conversão dos placares
        run: python3 -m unittest discover -s tests -p test_football.py -v
      - name: Compilar KPlayer
        run: |
          aarch64-linux-gnu-gcc -O2 -std=gnu11 -Wall -Wextra -Werror \
            -I source/include source/kplayer.c -o ports/kplayer/kplayer \
            -ldl -lpthread -lm
          file ports/kplayer/kplayer
      - name: Gerar pacote e checksum
        env:
          KPLAYER_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 tools/package_release.py
      - name: Disponibilizar artefato para teste
        uses: actions/upload-artifact@v4
        with:
          name: KPlayer-R36S
          path: |
            releases/KPlayer-v*-R36S.zip
            releases/KPlayer-v*-R36S.zip.sha256
          if-no-files-found: error
      - name: Preparar rascunho da release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: KPlayer ${{ github.ref_name }}
          body: Pacote experimental para R36S/dArkOS. Confira os testes e as notas antes de publicar.
          fail_on_unmatched_files: true
          files: |
            releases/KPlayer-v*-R36S.zip
            releases/KPlayer-v*-R36S.zip.sha256
