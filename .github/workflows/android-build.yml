name: KPlayer - Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "source/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "source/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Android project
        id: android-project
        shell: bash
        run: |
          if [[ -f android/gradlew && ( -f android/settings.gradle || -f android/settings.gradle.kts ) ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::O repositório ainda não contém um projeto Android Gradle (android/gradlew + settings.gradle). Nenhum APK será gerado nesta execução."
          fi

      - name: Set up Java
        if: steps.android-project.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.android-project.outputs.ready == 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        if: steps.android-project.outputs.ready == 'true'
        run: sdkmanager "ndk;27.2.12479018"

      - name: Build debug APK
        if: steps.android-project.outputs.ready == 'true'
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        if: steps.android-project.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: KPlayer-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
